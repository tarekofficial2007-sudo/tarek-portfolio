<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin dashboard</title><style>*{box-sizing:border-box}body{margin:0;background:#141416;color:#f3f3f4;font:16px/1.6 system-ui,Segoe UI,Arial,sans-serif}a{color:#ff6b81}
.card{background:#1d1d20;border:1px solid #34343a;border-top:4px solid #c8102e;padding:22px;margin:0 auto 18px;max-width:760px}h1,h2{margin:0 0 12px}h2{font-size:20px}
label{display:block;font-size:14px;color:#c9c9d0;margin:12px 0 4px}input,textarea,select{width:100%;padding:11px;background:#141416;color:#fff;border:1px solid #4a4a52;font:inherit}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid #c8102e;outline-offset:1px}
button{background:#c8102e;color:#fff;border:0;padding:12px 22px;font:600 15px system-ui;cursor:pointer;min-height:44px}button.ghost{background:transparent;border:2px solid #c8102e}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:760px;margin:0 auto;padding:16px 20px}.err{color:#ff8a9a;min-height:24px;margin:10px 0 0}.ok{color:#7ddc9a}
.row{border:1px solid #34343a;padding:14px;margin:12px 0}.row .r{display:grid;grid-template-columns:140px 1fr;gap:10px}@media(max-width:560px){.row .r{grid-template-columns:1fr}.card{margin-left:12px;margin-right:12px}}</style></head><body><div id="app" hidden><div class="bar"><h1 style="margin:0;font-size:22px">Dashboard</h1><span><a href="/" target="_blank" rel="noopener">View site</a> &nbsp; <button id="out" class="ghost">Log out</button></span></div>
<section class="card"><h2>About Me</h2><label for="aboutHeadline">Headline</label><input id="aboutHeadline" maxlength="120"><label for="aboutText">About text</label><textarea id="aboutText" rows="5" maxlength="1200"></textarea><label for="goals">Professional goals</label><textarea id="goals" rows="3" maxlength="500"></textarea></section>
<section class="card"><h2>Culinary Skills</h2><div id="sk"></div><button id="add" class="ghost" type="button">+ Add skill</button></section>
<section class="card"><h2>Contact</h2><label for="email">Email</label><input id="email" type="email"><label for="instagram">Instagram link</label><input id="instagram" type="url" placeholder="https://"><label for="facebook">Facebook link</label><input id="facebook" type="url" placeholder="https://"></section>
<style>.media{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}.media img,.g img{display:block;max-width:100%;background:#1c1c1e;margin:6px 0}.media img{max-height:170px}.g{display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:center;border:1px solid #34343a;padding:10px;margin:10px 0}.g img{width:90px;height:90px;object-fit:cover;margin:0}.g .b{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.g button{padding:6px 12px;min-height:36px}input[type=file]{padding:8px}</style>
<section class="card"><h2>Photos and logo</h2><p style="color:#a9a9b0;font-size:14px;margin:0">Choose a file and it is saved straight away. Photos are shrunk automatically. The logo should be a PNG with a see-through background.</p><div class="media">
<div><label>Hero photo</label><img id="p_heroPhoto" alt=""><input type="file" accept="image/*" data-up="heroPhoto"></div>
<div><label>About photo</label><img id="p_aboutPhoto" alt=""><input type="file" accept="image/*" data-up="aboutPhoto"></div>
<div><label>Logo</label><img id="p_logo" alt=""><input type="file" accept="image/png,image/webp,image/jpeg" data-up="logo"></div></div></section>
<section class="card"><h2>Gallery</h2><div id="gal"></div><label for="galAdd">Add photos</label><input type="file" id="galAdd" accept="image/*" multiple></section>
<section class="card"><h2>CV (PDF)</h2><p id="cvst" style="margin:0 0 8px"></p><input type="file" id="cvIn" accept="application/pdf"><p style="color:#a9a9b0;font-size:14px">Maximum about 650 KB.</p></section>
<p id="mst" role="status" class="card" style="padding:12px 22px"></p>
<section class="card"><button id="save">Save changes</button> <span id="st" role="status"></span><p style="color:#a9a9b0;font-size:14px"></p></section></div>
<script type="module">import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';import {getAuth,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';import {getFirestore,doc,getDoc,setDoc,deleteDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
import {firebaseConfig} from '../js/firebase-config.js';import {DEFAULTS} from '../js/defaults.js';import {ICONS} from '../js/icons.js';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=i=>document.getElementById(i),F=['aboutHeadline','aboutText','goals','email','instagram','facebook'];let skills=[];
const out=async m=>{try{await signOut(auth)}catch(e){}location.replace('/admin'+(m?'?m='+m:''))};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function draw(){$('sk').innerHTML=skills.map((s,i)=>`<div class="row" data-i="${i}"><div class="r"><div><label>Icon</label><select data-k="icon">${Object.keys(ICONS).map(k=>`<option ${k==s.icon?'selected':''}>${k}</option>`).join('')}</select></div><div><label>Title</label><input data-k="title" maxlength="60" value="${esc(s.title)}"></div></div><label>Description</label><textarea data-k="text" rows="2" maxlength="220">${esc(s.text)}</textarea><button type="button" class="ghost" data-del="${i}" style="margin-top:10px">Delete</button></div>`).join('')}
$('sk').oninput=e=>{const r=e.target.closest('.row');if(r&&e.target.dataset.k)skills[r.dataset.i][e.target.dataset.k]=e.target.value};
$('sk').onclick=e=>{if(e.target.dataset.del!==undefined&&confirm('Delete this skill?')){skills.splice(+e.target.dataset.del,1);draw()}};
$('add').onclick=()=>{skills.push({icon:'star' in ICONS?'star':'leaf',title:'',text:''});draw()};

const ALTS=['Fish in a rich red sauce topped with fresh chilli, spring onion and herbs','Baked creamy pasta topped with crisp potato chips and fresh basil','Penne pasta in tomato sauce with fresh basil and parmesan','Noodle soup with grilled stuffed chicken, carrot, cucumber and sesame','Seafood rice with squid, prawns, vegetables and parsley','Crumbed chicken cutlets with fried rice and stir-fried vegetables'];
let C={},imgs={};const st=(m,ok)=>{const e=$('mst');e.textContent=m;e.className='card'+(ok?' ok':'');e.style.padding='12px 22px'};
const emsg=e=>e&&e.code=='permission-denied'?'Not allowed: you are not the admin.':(e&&e.message)||'Something went wrong.';
const mkid=p=>p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),saveC=x=>setDoc(doc(db,'site','content'),x,{merge:true}),drop=id=>{if(id)deleteDoc(doc(db,'site',id)).catch(()=>{})};
async function putImg(url){const id=mkid('img');await setDoc(doc(db,'site',id),{data:url,at:serverTimestamp()});imgs[id]=url;return id}
async function loadImg(id){if(!id||imgs[id])return;try{const x=await getDoc(doc(db,'site',id));if(x.exists())imgs[id]=x.data().data}catch(e){}}
function shrink(f,max,type,q){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);im.onerror=()=>no(new Error('That file is not a valid image.'));im.onload=()=>{URL.revokeObjectURL(u);let m=max,qq=q;for(let i=0;i<9;i++){const s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const x=c.getContext('2d');if(type=='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);const d=c.toDataURL(type,qq);if(d.length<900000)return ok(d);m*=.8;qq=Math.max(.5,qq-.08)}no(new Error('Image is too large.'))};im.src=u})}
function media(){const P={heroPhoto:'../img/profile-hero.jpg',aboutPhoto:'../img/profile-about.jpg',logo:'../img/logo.png'};for(const k in P)$('p_'+k).src=imgs[C[k]]||P[k];
$('cvst').textContent=C.cv?'A custom CV is live on your website.':'Your original CV is live on your website.';
$('gal').innerHTML=C.gallery.map((g,i)=>`<div class="g"><img src="${esc(g.id?imgs[g.id]||'':'../'+g.src)}" alt=""><div><input data-alt="${i}" maxlength="140" value="${esc(g.alt)}" aria-label="Photo description"><div class="b"><button type="button" class="ghost" data-mv="${i}:-1">Up</button><button type="button" class="ghost" data-mv="${i}:1">Down</button><button type="button" class="ghost" data-rm="${i}">Delete</button></div></div></div>`).join('')||'<p>No photos yet.</p>'}
async function boot(d){C={heroPhoto:d.heroPhoto||null,aboutPhoto:d.aboutPhoto||null,logo:d.logo||null,cv:d.cv||null,gallery:(d.gallery||ALTS.map((a,i)=>({src:'img/gallery-'+(i+1)+'.jpg',alt:a}))).map(g=>({...g}))};
await Promise.all([C.heroPhoto,C.aboutPhoto,C.logo,...C.gallery.map(g=>g.id)].map(loadImg));media()}
document.querySelectorAll('[data-up]').forEach(i=>i.onchange=async()=>{const f=i.files[0],k=i.dataset.up;if(!f)return;try{st('Uploading...');const L=k=='logo',u=await shrink(f,L?600:900,L?'image/png':'image/jpeg',.82),id=await putImg(u),old=C[k];await saveC({[k]:id});C[k]=id;drop(old);media();st('Saved. Your public website now shows the new image.',1)}catch(e){st(emsg(e))}i.value=''});
$('galAdd').onchange=async e=>{const fs=[...e.target.files];try{for(const f of fs){if(C.gallery.length>=24)throw new Error('Maximum 24 photos.');st('Uploading '+f.name+'...');const id=await putImg(await shrink(f,1000,'image/jpeg',.8));C.gallery.push({id,alt:'Dish photo'});await saveC({gallery:C.gallery});media()}st('Saved. Your gallery is updated.',1)}catch(x){st(emsg(x))}e.target.value=''};
$('gal').onchange=async e=>{if(e.target.dataset.alt!==undefined){C.gallery[+e.target.dataset.alt].alt=e.target.value.trim();try{await saveC({gallery:C.gallery});st('Saved.',1)}catch(x){st(emsg(x))}}};
$('gal').onclick=async e=>{const t=e.target;try{if(t.dataset.mv){const[i,n]=t.dataset.mv.split(':').map(Number),j=i+n;if(j<0||j>=C.gallery.length)return;[C.gallery[i],C.gallery[j]]=[C.gallery[j],C.gallery[i]]}else if(t.dataset.rm!==undefined){if(!confirm('Delete this photo?'))return;const[g]=C.gallery.splice(+t.dataset.rm,1);drop(g.id)}else return;await saveC({gallery:C.gallery});media();st('Saved.',1)}catch(x){st(emsg(x))}};
$('cvIn').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.type!='application/pdf')throw new Error('Please choose a PDF file.');const u=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(new Error('Could not read the file.'));r.readAsDataURL(f)});if(u.length>=900000)throw new Error('This PDF is too big (maximum about 650 KB). Compress it first, for example at ilovepdf.com.');st('Uploading...');const id=await putImg(u),old=C.cv;await saveC({cv:id});C.cv=id;drop(old);media();st('Saved. Your new CV is live.',1)}catch(x){st(emsg(x))}e.target.value=''};
onAuthStateChanged(auth,async u=>{if(!u)return location.replace('/admin');
try{await getDoc(doc(db,'admin','ping'))}catch(e){return out('denied')}
let d={};try{const s=await getDoc(doc(db,'site','content'));if(s.exists())d=s.data()}catch(e){}
d={...DEFAULTS,...d};await boot(d);F.forEach(k=>$(k).value=d[k]||'');skills=(d.skills||[]).map(s=>({...s}));draw();$('app').hidden=false;
let t;const idle=()=>{clearTimeout(t);t=setTimeout(()=>out('idle'),1800000)};['click','keydown','touchstart'].forEach(v=>addEventListener(v,idle));idle()});
$('out').onclick=()=>out();
$('save').onclick=async()=>{const st=$('st'),d={};F.forEach(k=>d[k]=$(k).value.trim());st.className='';
if(d.email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email))return st.textContent='Please enter a valid email.';
for(const k of ['instagram','facebook'])if(d[k]&&!/^https:\/\//i.test(d[k]))return st.textContent='Links must start with https://';
d.skills=skills.filter(s=>s.title.trim()).map(s=>({icon:s.icon,title:s.title.trim(),text:s.text.trim()}));d.updatedAt=serverTimestamp();
try{await setDoc(doc(db,'site','content'),d,{merge:true});st.className='ok';st.textContent='Saved. Your public website now shows these changes.'}catch(e){st.textContent=e.code=='permission-denied'?'Not allowed: you are not the admin.':'Could not save. Check your connection and try again.'}};</script></body></html>
