async function putImg(u){const id=mkid('img');await setDoc(P('site/'+id),{data:u,at:serverTimestamp()});imgs[id]=u;return id}
async function loadImg(id){if(!id||imgs[id])return;try{const x=await getDoc(P('site/'+id));if(x.exists())imgs[id]=x.data().data}catch(e){}}
function shrink(f,max,type,q){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);im.onerror=()=>no(new Error('Eta valid chhobi noy.'));im.onload=()=>{URL.revokeObjectURL(u);let m=max,qq=q;for(let i=0;i<9;i++){const s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const x=c.getContext('2d');if(type=='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);const d=c.toDataURL(type,qq);if(d.length<900000)return ok(d);m*=.8;qq=Math.max(.5,qq-.08)}no(new Error('Chhobi onek boro.'))};im.src=u})}
const photo=k=>imgs[D()[k]]||{heroPhoto:'../img/profile-hero.jpg',aboutPhoto:'../img/profile-about.jpg',logo:'../img/logo.png'}[k];

let pend={},psec=new Set();
function save(patch,sec){Object.assign(pend,patch);psec.add(sec);clearTimeout(tmr);tmr=setTimeout(flush,500);W.data={...W.data,...patch}}
async function flush(){clearTimeout(tmr);if(!Object.keys(pend).length)return;const p=pend,s=[...psec];pend={};psec=new Set();try{await A.saveDraft(p,s[0]);for(const x of s.slice(1))await A.saveDraft({},x);s.forEach(x=>{if(!W.sections.includes(x))W.sections.push(x)});W.data={...W.data,...p};top2()}catch(e){toast(emsg(e),1)}}
async function saveNow(patch,sec){await flush();await A.saveDraft(patch,sec);if(!W.sections.includes(sec))W.sections.push(sec);W.data={...W.data,...patch};top2()}
function top2(){const n=W.sections.length;$('dp').textContent=n?n+' ti change':'Shob live';$('dp').className='dp'+(n?'':' ok');$('pbtn').className='ob'+(n?'':' off');$('hd').hidden=!n;
document.querySelectorAll('#mn button').forEach(b=>b.classList.toggle('chg',W.sections.includes(b.dataset.t)));clearTimeout(pt);pt=setTimeout(pvLoad,600)}
function pvLoad(){const f=$('pif');if(!f||cur=='his')return;const T=TABS[cur];if(!T)return;$('pu').textContent='tarek-chef.netlify.app/'+T.a;if(f.dataset.on!='1'){f.dataset.on='1';f.onload=()=>{send();setTimeout(send,500);setTimeout(sc,800);setTimeout(sc,1800)};f.src='/?preview=1'+T.a}else{try{f.contentWindow.location.hash=T.a;f.contentWindow.location.reload()}catch(e){f.src='/?preview=1'+T.a}}}
const sc=()=>{try{const T=TABS[cur],e=T&&T.a&&$('pif').contentDocument.querySelector(T.a);if(e)e.scrollIntoView()}catch(x){}};
const send=()=>{try{$('pif').contentWindow.postMessage({tcPreview:1,d:D(),imgs},location.origin)}catch(e){}};
async function refreshMsg(){let m=[];try{m=await A.messages()}catch(e){}const u=m.filter(x=>!x.read).length;const c=$('nc');if(c){c.hidden=!u;c.textContent=u}
const l=$('ml');if(l)l.innerHTML=m.length?m.map(x=>`<button class="ms${x.read?'':' u'}" data-m="${x.id}"><b>${esc(x.name)}</b><span>${tm(x.at)}</span><p>${esc(String(x.message).slice(0,90))}</p></button>`).join(''):'<p class="hp">Ekhono kono message ashe ni.</p>';window._M=m}
const tm=t=>{const d=new Date(t);return isNaN(d)?'':d.toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})};
async function refreshHist(){let h=[];try{h=await A.history()}catch(e){}$('hs').innerHTML=h.length?h.map(x=>`<div class="row"><b>${tm(x.at)}</b><div class="hp">${esc(x.note||'')}</div><button class="bt" data-r="${x.id}">Ei version-e fire jan</button></div>`).join(''):'<p class="hp">Ekhono kono puraton version nei. Prothom Publish-er por ekhane dekhabe.</p>'}
function fields(T){return T.f.map(([n,l,h,r,m])=>`<label for="f_${n}">${l}</label><p class="hp">${h}${!D()[n]&&n!='youtube'&&n!='tiktok'?' Khali rakhle website-er ager lekha-i thakbe.':''}</p>${r>1?`<textarea id="f_${n}" data-f="${n}" rows="${r}" maxlength="${m}">`+esc(D()[n]||'')+'</textarea>':`<input id="f_${n}" data-f="${n}" maxlength="${m}" value="${esc(D()[n]||'')}">`}`).join('')}
function photosH(l){return l.map(([n,t,h])=>`<label>${t}</label><p class="hp">${h}</p><img class="ph" id="ph_${n}" src="${esc(photo(n))}" alt="" style="max-width:220px;border-radius:12px;display:block;margin:6px 0"><input type="file" accept="image/*" data-up="${n}">`).join('')+'<p class="hp" style="margin-top:12px">Boro chhobi dileo nijei chhoto hoye jabe.</p>'}
function show(k){const T=TABS[k];if(!T)return;flush();ck=k;cur=k;$('bd').hidden=false;$('hv').hidden=true;$('app').style.setProperty('--c',T.c);
document.querySelectorAll('#mn button').forEach(b=>b.classList.toggle('on',b.dataset.t==k));$('hk').textContent=T.k;$('ht').innerHTML=T.h;$('hpp').textContent=T.p;$('hp1').hidden=false;const pl=$('pl');pl.src='../admin-plate-'+T.pl.slice(1)+'.webp';pl.className='pl'+(T.wide?' wide':'');
let h=`<h2>${k}-er lekha</h2>`+fields(T);if(T.ph)h+=photosH(T.ph);
if(T.x=='skills'){sk=(D().skills||[]).map(s=>({...s}));h+='<h3 class="sub">Skill card</h3><div id="skl">'+skillsH()+'</div>'}
if(T.x=='gallery'){gal=(D().gallery||ALTS.map((a,i)=>({src:'img/gallery-'+(i+1)+'.jpg',alt:a}))).map(g=>({...g}));h+='<h3 class="sub">Chhobi</h3><div id="gl">'+galH()+'</div>'}
if(T.x=='cv')h+=`<h3 class="sub">CV file</h3><p class="hp">${D().cv?'Notun CV live-er jonno prostut.':'Ager CV ekhon website-e ache.'}</p><label for="cvi">Notun CV (PDF)</label><p class="hp">Maximum prai 650 KB.</p><input type="file" id="cvi" accept="application/pdf">`;
if(T.x=='msg')h+='<h3 class="sub">Message</h3><div id="ml"></div>';
$('se').innerHTML=h;if(T.x=='msg')refreshMsg();scrollTo(0,0);pvLoad()}
function showHist(){cur='his';$('bd').hidden=true;$('hv').hidden=false;document.querySelectorAll('#mn button').forEach(b=>b.classList.remove('on'));$('hk').textContent='HISTORY';$('ht').innerHTML='Puraton version<br>fire jan';$('hpp').textContent='Publish-er age-r live version gulo. Bhul hole 1 tap-e fire jan.';$('hp1').hidden=true;$('pl').src='../admin-plate-4.webp';$('pl').className='pl';scrollTo(0,0);refreshHist()}
function skillsH(){return sk.map((s,i)=>`<div class="row" data-i="${i}"><label>Icon</label><select data-k="icon">${Object.keys(ICONS).map(k=>`<option ${k==s.icon?'selected':''}>${k}</option>`).join('')}</select><label>Naam</label><input data-k="title" maxlength="60" value="${esc(s.title)}"><label>Bornona</label><textarea data-k="text" rows="2" maxlength="220">${esc(s.text)}</textarea><div class="x"><button class="bt" data-del="${i}">Mushe din</button></div></div>`).join('')+(sk.length<6?'<button class="bt k" id="ska">+ Notun skill</button>':'<p class="hp">Maximum 6 ti skill.</p>')}
function galH(){return gal.map((g,i)=>`<div class="row gi"><img src="${esc(g.id?imgs[g.id]||'':'../'+g.src)}" alt=""><div><input data-alt="${i}" maxlength="140" value="${esc(g.alt)}" aria-label="Chhobir bornona"><div class="x"><button class="bt" data-mv="${i}:-1">Upore</button><button class="bt" data-mv="${i}:1">Niche</button><button class="bt" data-rm="${i}">Mushe din</button></div></div></div>`).join('')+'<label for="gadd">Notun chhobi dien</label><p class="hp">Boro chhobi nijei chhoto hobe. Maximum 24 ti.</p><input type="file" id="gadd" accept="image/*" multiple>'}
$('se').addEventListener('input',e=>{const t=e.target;if(t.dataset.f)save({[t.dataset.f]:t.value.trim()},ck);else if(t.dataset.k&&t.closest('[data-i]')){sk[+t.closest('[data-i]').dataset.i][t.dataset.k]=t.value;save({skills:sk.filter(s=>s.title.trim()).map(s=>({icon:s.icon,title:s.title.trim(),text:s.text.trim()}))},'Skills')}else if(t.dataset.alt!==undefined){gal[+t.dataset.alt].alt=t.value.trim();save({gallery:gal},'Gallery')}});
$('se').addEventListener('click',async e=>{const t=e.target;try{if(t.id=='ska'){sk.push({icon:'leaf',title:'',text:''});$('skl').innerHTML=skillsH()}else if(t.dataset.del!==undefined){if(await ask('Skill mushben?','Eta draft theke jabe, Publish-er age live-e kichu bodlabe na.','Mushe din')){sk.splice(+t.dataset.del,1);$('skl').innerHTML=skillsH();await saveNow({skills:sk.filter(s=>s.title.trim()).map(s=>({icon:s.icon,title:s.title.trim(),text:s.text.trim()}))},'Skills')}}
else if(t.dataset.mv){const[i,n]=t.dataset.mv.split(':').map(Number),j=i+n;if(j<0||j>=gal.length)return;[gal[i],gal[j]]=[gal[j],gal[i]];await saveNow({gallery:gal},'Gallery');$('gl').innerHTML=galH()}
else if(t.dataset.rm!==undefined){if(await ask('Chhobi mushben?','Eta draft theke jabe. Puraton version-e fire gele abar pawa jabe.','Mushe din')){gal.splice(+t.dataset.rm,1);await saveNow({gallery:gal},'Gallery');$('gl').innerHTML=galH()}}}catch(x){toast(emsg(x),1)}});
$('se').addEventListener('change',async e=>{const t=e.target,f=t.files&&t.files[0];try{if(t.dataset.up&&f){const L=t.dataset.up=='logo';toast('Upload hochhe...');const id=await putImg(await shrink(f,L?600:900,L?'image/png':'image/jpeg',.82));await saveNow({[t.dataset.up]:id},ck);$('ph_'+t.dataset.up).src=imgs[id];toast('Draft-e save hoyeche')}
else if(t.id=='gadd'){for(const g of t.files){if(gal.length>=24)throw new Error('Maximum 24 ti chhobi.');gal.push({id:await putImg(await shrink(g,1000,'image/jpeg',.8)),alt:'Dish photo'})}await saveNow({gallery:gal},'Gallery');$('gl').innerHTML=galH();toast('Draft-e save hoyeche')}
else if(t.id=='cvi'&&f){if(f.type!='application/pdf')throw new Error('PDF file bachun.');const u=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(new Error('File poRa gelo na.'));r.readAsDataURL(f)});if(u.length>=900000)throw new Error('PDF ti boro (maximum prai 650 KB). Age chhoto korun.');await saveNow({cv:await putImg(u)},ck);toast('Draft-e save hoyeche')}}catch(x){toast(emsg(x),1)}t.value=''});

document.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t)return;
if(t.dataset.t&&t.closest('#mn'))show(t.dataset.t);
else if(t.dataset.m){const m=window._M.find(x=>x.id==t.dataset.m);if(!m)return;$('ml').innerHTML=`<button class="bk" id="mb">&larr; Message-e fire jan</button><div class="row"><b>${esc(m.name)}</b><div class="hp">${esc(m.email)} &middot; ${tm(m.at)}</div><p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(m.message)}</p><div class="x"><a class="bt r" href="mailto:${esc(m.email)}">Reply</a><button class="bt" data-dm="${m.id}">Mushe din</button></div></div>`;if(!m.read)A.markRead(m.id).catch(()=>{})}
else if(t.id=='mb')refreshMsg();else if(t.dataset.dm){if(await ask('Message mushben?','Eta ar fire pawa jabe na.','Mushe din')){await A.removeMsg(t.dataset.dm).catch(x=>toast(emsg(x),1));refreshMsg()}}
else if(t.dataset.r){if(await ask('Ei version-e fire jaben?','Website ei version-e fire jabe. Ajker version-o History-te jomano thakbe.','Fire jan')){try{await A.restore(t.dataset.r);W=await A.working();top2();refreshHist();toast('Fire gechhi')}catch(x){toast(emsg(x),1)}}}});
$('hb').onclick=showHist;$('pbtn').onclick=pub;$('hp1').onclick=prev;$('hd').onclick=disc;
async function pub(){await flush();if(!W.sections.length)return;if(await ask('Website-e live korben?','Visitor-ra '+W.sections.length+' ti jaygar notun change dekhbe. Ager version History-te jomano thakbe, bhul hole fire jete parben.','Publish')){try{await A.publish(W.sections.join(', '));W=await A.working();top2();toast('Published')}catch(x){toast(emsg(x),1)}}}
async function disc(){if(await ask('Draft bad dibe?','Shob na-publish kora change muche jabe, website jemon ache temon thakbe.','Discard')){try{await A.discard();W=await A.working();top2();toast('Discarded')}catch(x){toast(emsg(x),1)}}}
function prev(){let o=document.getElementById('pvw');if(o)o.remove();o=document.createElement('div');o.id='pvw';o.style.cssText='position:fixed;inset:0;z-index:20;background:#e8e8e8;display:flex;flex-direction:column';
o.innerHTML='<div style="display:flex;gap:8px;align-items:center;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top))"><button class="bt" id="pvx">&larr; Fire jan</button><b style="flex:1;text-align:center">Preview</b><button class="bt k" id="pvp">Phone</button><button class="bt" id="pvd">Desktop</button></div><div style="flex:1;display:flex;justify-content:center;min-height:0"><iframe id="pvf" title="Preview" src="/?preview=1" style="border:0;background:#fff;width:390px;max-width:100%;height:100%"></iframe></div>';document.body.append(o);
const f=document.getElementById('pvf'),send=()=>{try{f.contentWindow.postMessage({tcPreview:1,d:D(),imgs},location.origin)}catch(e){}};f.onload=()=>{send();setTimeout(send,500)};
document.getElementById('pvx').onclick=()=>o.remove();const pp=document.getElementById('pvp'),pd=document.getElementById('pvd');
pp.onclick=()=>{f.style.width='390px';pp.className='bt k';pd.className='bt'};pd.onclick=()=>{f.style.width='100%';pd.className='bt k';pp.className='bt'}}

const out=async m=>{try{await signOut(auth)}catch(e){}location.replace('/admin'+(m?'?m='+m:''))};$('out').onclick=()=>out();
$('mn').innerHTML=Object.keys(TABS).map(k=>`<button data-t="${k}" style="--m:${MC[k]}">${k}${k=='Contact'?'<i id="nc" hidden></i>':''}</button>`).join('');
onAuthStateChanged(auth,async u=>{if(!u)return location.replace('/admin');try{await getDoc(P('admin/ping'))}catch(e){return out('denied')}
try{W=await A.working()}catch(e){}await Promise.all(['heroPhoto','aboutPhoto','logo'].map(k=>loadImg(D()[k])));
(D().gallery||[]).forEach(g=>loadImg(g.id));$('app').hidden=false;show('Home');top2();refreshMsg();
let t;const idle=()=>{clearTimeout(t);t=setTimeout(()=>out('idle'),1800000)};['click','keydown','touchstart'].forEach(v=>addEventListener(v,idle));idle()});
</script>
</body></html>
