<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin login</title><style>*{box-sizing:border-box}body{margin:0;background:#141416;color:#f3f3f4;font:16px/1.6 system-ui,Segoe UI,Arial,sans-serif}a{color:#ff6b81}
.card{background:#1d1d20;border:1px solid #34343a;border-top:4px solid #c8102e;padding:22px;margin:0 auto 18px;max-width:760px}h1,h2{margin:0 0 12px}h2{font-size:20px}
label{display:block;font-size:14px;color:#c9c9d0;margin:12px 0 4px}input,textarea,select{width:100%;padding:11px;background:#141416;color:#fff;border:1px solid #4a4a52;font:inherit}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid #c8102e;outline-offset:1px}
button{background:#c8102e;color:#fff;border:0;padding:12px 22px;font:600 15px system-ui;cursor:pointer;min-height:44px}button.ghost{background:transparent;border:2px solid #c8102e}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:760px;margin:0 auto;padding:16px 20px}.err{color:#ff8a9a;min-height:24px;margin:10px 0 0}.ok{color:#7ddc9a}
.row{border:1px solid #34343a;padding:14px;margin:12px 0}.row .r{display:grid;grid-template-columns:140px 1fr;gap:10px}@media(max-width:560px){.row .r{grid-template-columns:1fr}.card{margin-left:12px;margin-right:12px}}</style></head><body><main style="min-height:100vh;display:grid;place-items:center;padding:20px"><form id="f" class="card" style="width:100%;max-width:400px" autocomplete="on"><h1>TAREK Admin</h1><p style="color:#a9a9b0;margin:0 0 6px">Sign in to manage your portfolio.</p>
<label for="u">Username</label><input id="u" autocomplete="username" required><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
<p id="e" class="err" role="alert"></p><button style="width:100%">Log in</button></form></main>
<script type="module">import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';import {getAuth,setPersistence,browserSessionPersistence,signInWithEmailAndPassword,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';import {firebaseConfig,USERNAMES} from '../js/firebase-config.js';
const auth=getAuth(initializeApp(firebaseConfig)),$=i=>document.getElementById(i),go=()=>location.replace('/admin/dashboard');
const m=new URLSearchParams(location.search).get('m');if(m)$('e').textContent=m=='idle'?'You were signed out after 30 minutes of inactivity.':'This account is not authorised.';
onAuthStateChanged(auth,u=>{if(u&&!m)go()});
$('f').onsubmit=async ev=>{ev.preventDefault();$('e').textContent='';const email=USERNAMES[$('u').value.trim().toLowerCase()];
try{if(!email)throw{code:'auth/invalid-credential'};await setPersistence(auth,browserSessionPersistence);await signInWithEmailAndPassword(auth,email,$('p').value);go()}
catch(x){$('p').value='';$('e').textContent=x.code=='auth/too-many-requests'?'Too many attempts. Please wait a few minutes and try again.':'Incorrect username or password.'}};</script></body></html>
